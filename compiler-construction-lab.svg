<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="COMPILER CONSTRUCTION LAB" xmlns:c2pa="http://c2pa.org/manifest">
  <title>COMPILER CONSTRUCTION LAB</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.35" stop-color="#06b6d4"/>
      <stop offset="0.7" stop-color="#10b981"/>
      <stop offset="1" stop-color="#f59e0b"/>
      <animate attributeName="x1" values="0;800" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="800;1600" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="type">
      <rect x="50" y="50" height="90" width="0">
        <animate attributeName="width" calcMode="discrete" dur="2.4s" begin="0.3s" fill="freeze"
          values="0;32;64;96;128;160;192;224;256;288;320;352;384;416;448;480;512;544;576;608;640;672;704;736;768;800;840"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace; }
    .muted { fill: #6e7781; }
    .nf { fill: #8b5cf6; fill-opacity: 0.06; stroke: #8b5cf6; stroke-opacity: 0.7; stroke-width: 1.5; }
    .nb { fill: #06b6d4; fill-opacity: 0.06; stroke: #06b6d4; stroke-opacity: 0.75; stroke-width: 1.5; }
    .namef { fill: #6d4fd6; font-size: 13px; font-weight: 700; }
    .nameb { fill: #0891b2; font-size: 13px; font-weight: 700; }
    .sub { fill: #6e7781; font-size: 11px; }
    .num { fill: #6e7781; font-size: 10px; letter-spacing: 2px; opacity: .8; }
    .grp { fill: #6e7781; font-size: 12px; letter-spacing: 1px; font-weight: 600; }
    .brk { stroke: #6e7781; stroke-opacity: 0.5; stroke-width: 1.5; fill: none; }
    .tick { stroke: #6e7781; stroke-opacity: 0.35; stroke-width: 1.2; stroke-dasharray: 2 3; fill: none; }
    .strip { fill: #6e7781; fill-opacity: 0.07; stroke: #6e7781; stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 5 4; animation: dash 1.6s linear infinite; }
    .link { stroke: #6e7781; stroke-opacity: 0.55; stroke-width: 1.5; stroke-dasharray: 4 5; fill: none; animation: dash 1.2s linear infinite; }
    @media (prefers-color-scheme: dark) {
      .muted, .sub, .num, .grp { fill: #8b949e; }
      .namef { fill: #b49cff; }
      .nameb { fill: #5ad1e6; }
      .link, .brk, .tick, .strip { stroke: #8b949e; }
      .strip { fill: #8b949e; }
    }
    @keyframes dash { to { stroke-dashoffset: -9; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <text x="50" y="42" class="mono muted" font-size="14" opacity="0">
    // analyze → synthesize → emit
    <animate attributeName="opacity" values="0;0.9" dur="0.6s" begin="0s" fill="freeze"/>
  </text>

  <g clip-path="url(#type)">
    <g class="mono" font-size="46" font-weight="800" text-anchor="middle" fill="url(#g)">
      <text x="66" y="110">C</text>
      <text x="98" y="110">O</text>
      <text x="130" y="110">M</text>
      <text x="162" y="110">P</text>
      <text x="194" y="110">I</text>
      <text x="226" y="110">L</text>
      <text x="258" y="110">E</text>
      <text x="290" y="110">R</text>
      <text x="354" y="110">C</text>
      <text x="386" y="110">O</text>
      <text x="418" y="110">N</text>
      <text x="450" y="110">S</text>
      <text x="482" y="110">T</text>
      <text x="514" y="110">R</text>
      <text x="546" y="110">U</text>
      <text x="578" y="110">C</text>
      <text x="610" y="110">T</text>
      <text x="642" y="110">I</text>
      <text x="674" y="110">O</text>
      <text x="706" y="110">N</text>
      <text x="770" y="110">L</text>
      <text x="802" y="110">A</text>
      <text x="834" y="110">B</text>
    </g>
  </g>

  <rect x="852" y="66" width="14" height="52" rx="2" fill="#06b6d4" class="blink" opacity="0">
    <set attributeName="opacity" to="1" begin="2.7s"/>
  </rect>

  <rect x="50" y="130" height="3" rx="1.5" width="0" fill="url(#g)">
    <animate attributeName="width" values="0;800" dur="0.9s" begin="2.7s" fill="freeze"/>
  </rect>

  <g class="mono">
    <text class="grp" x="243.6" y="158" text-anchor="middle">Front-End (Analysis Phase)</text>
    <path class="brk" d="M50 172 V166 H437.2 V172"/>
    <text class="grp" x="656.4" y="158" text-anchor="middle">Back-End (Synthesis Phase)</text>
    <path class="brk" d="M462.8 172 V166 H850 V172"/>

    <path class="link" d="M162 223.0 H187.6"/>
    <path class="link" d="M299.6 223.0 H325.2"/>
    <path class="link" d="M437.2 223.0 H462.8"/>
    <path class="link" d="M574.8 223.0 H600.4"/>
    <path class="link" d="M712.4 223.0 H738"/>

    <rect class="nf" x="50" y="182" width="112" height="82" rx="10">
      <animate attributeName="fill-opacity" dur="9s" begin="3.4s" repeatCount="indefinite" keyTimes="0;.08;1" values=".3;.06;.06"/>
    </rect>
    <path class="tick" d="M106.0 264 V278"/>
    <rect class="nf" x="187.6" y="182" width="112" height="82" rx="10">
      <animate attributeName="fill-opacity" dur="9s" begin="3.4s" repeatCount="indefinite" keyTimes="0;0.12;0.20;0.28;1" values=".06;.06;.3;.06;.06"/>
    </rect>
    <path class="tick" d="M243.6 264 V278"/>
    <rect class="nf" x="325.2" y="182" width="112" height="82" rx="10">
      <animate attributeName="fill-opacity" dur="9s" begin="3.4s" repeatCount="indefinite" keyTimes="0;0.32;0.40;0.48;1" values=".06;.06;.3;.06;.06"/>
    </rect>
    <path class="tick" d="M381.2 264 V278"/>
    <rect class="nb" x="462.8" y="182" width="112" height="82" rx="10">
      <animate attributeName="fill-opacity" dur="9s" begin="3.4s" repeatCount="indefinite" keyTimes="0;0.52;0.60;0.68;1" values=".06;.06;.3;.06;.06"/>
    </rect>
    <path class="tick" d="M518.8 264 V278"/>
    <rect class="nb" x="600.4" y="182" width="112" height="82" rx="10">
      <animate attributeName="fill-opacity" dur="9s" begin="3.4s" repeatCount="indefinite" keyTimes="0;0.72;0.80;0.88;1" values=".06;.06;.3;.06;.06"/>
    </rect>
    <path class="tick" d="M656.4 264 V278"/>
    <rect class="nb" x="738" y="182" width="112" height="82" rx="10">
      <animate attributeName="fill-opacity" dur="9s" begin="3.4s" repeatCount="indefinite" keyTimes="0;.92;1" values=".06;.06;.3"/>
    </rect>
    <path class="tick" d="M794.0 264 V278"/>

    <text class="num" x="106.0" y="200" text-anchor="middle">01</text>
    <text class="namef" x="106.0" y="220" text-anchor="middle">Lexical</text>
    <text class="namef" x="106.0" y="235" text-anchor="middle">Analysis</text>
    <text class="sub" x="106.0" y="250" text-anchor="middle">(Scanner)</text>
    <text class="num" x="243.6" y="200" text-anchor="middle">02</text>
    <text class="namef" x="243.6" y="220" text-anchor="middle">Syntax</text>
    <text class="namef" x="243.6" y="235" text-anchor="middle">Analysis</text>
    <text class="sub" x="243.6" y="250" text-anchor="middle">(Parser)</text>
    <text class="num" x="381.2" y="200" text-anchor="middle">03</text>
    <text class="namef" x="381.2" y="226" text-anchor="middle">Semantic</text>
    <text class="namef" x="381.2" y="241" text-anchor="middle">Analysis</text>
    <text class="num" x="518.8" y="200" text-anchor="middle">04</text>
    <text class="nameb" x="518.8" y="220" text-anchor="middle">Intermediate</text>
    <text class="nameb" x="518.8" y="235" text-anchor="middle">Code</text>
    <text class="nameb" x="518.8" y="250" text-anchor="middle">Generation</text>
    <text class="num" x="656.4" y="200" text-anchor="middle">05</text>
    <text class="nameb" x="656.4" y="226" text-anchor="middle">Code</text>
    <text class="nameb" x="656.4" y="241" text-anchor="middle">Optimization</text>
    <text class="num" x="794.0" y="200" text-anchor="middle">06</text>
    <text class="nameb" x="794.0" y="226" text-anchor="middle">Code</text>
    <text class="nameb" x="794.0" y="241" text-anchor="middle">Generation</text>

    <rect class="strip" x="50" y="278" width="800" height="26" rx="8"/>
    <text class="sub" x="450" y="295" text-anchor="middle">Symbol Table</text>
    <rect class="strip" x="50" y="312" width="800" height="26" rx="8"/>
    <text class="sub" x="450" y="329" text-anchor="middle">Error Handler</text>
  </g>

  <g opacity="0">
    <circle r="11" fill="#f59e0b" opacity="0.25"/>
    <circle r="5" fill="#f59e0b"/>
    <animateMotion path="M106.0,182 H794.0" dur="9s" begin="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.97;1" dur="9s" begin="3.4s" repeatCount="indefinite"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
